name: CI

# A conventional, well-maintained workflow. Nothing here should be reported:
# secrets are passed through env/with (never interpolated into a shell command),
# actions are pinned to the semver tags GitHub itself recommends, and the
# self-hosted job is only reachable from a trusted trigger.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}

  publish:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: pnpm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
