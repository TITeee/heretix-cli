version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: heretix-cli
    main: .
    binary: heretix-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/TITeee/heretix-cli/cmd.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Signs checksums.txt (which itself hashes every other artifact, so signing
# it covers all of them) with cosign's keyless mode -- identity comes from
# the CI job's own OIDC token (see release.yml's id-token: write permission),
# so there's no private key to generate or store. Verify with:
#   cosign verify-blob checksums.txt --signature checksums.txt.sig \
#     --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'https://github.com/TITeee/heretix-cli/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  disable: true

release:
  github:
    owner: TITeee
    name: heretix-cli
