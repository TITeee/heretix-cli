<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif">
<title id="t">heretix-cli の構成</title><desc id="d">heretix-cli は、サーバー、コンテナイメージ、ディレクトリにインストールされたパッケージを読み取ります。heretix-api で照合し、SBOM を heretix-management にアップロードし、GitHub に送って Dependabot に通知させ、結果をターミナルや CI に出力します。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
